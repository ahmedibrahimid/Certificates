name: Update README

# The paths filter deliberately EXCLUDES README.md so that the commit this
# workflow pushes cannot re-trigger the workflow (infinite-loop prevention).
# The commit message also carries [skip ci] as a second line of defence.
on:
  push:
    branches:
      - main
    paths:
      - 'certificates/**'
      - 'metadata/certificates.csv'
      - 'scripts/generate_readme.py'
      - '.github/workflows/update-readme.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit and push if README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate README [skip ci]"
          git push
